<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>கார்த்திக். வெ – ஆய்வாளர், எழுத்தாளர், பேச்சாளர்</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0d121c;--panel:#151c2b;--line:#263149;--text:#e9e6dc;--mute:#98a2b5;--gold:#e2b04a}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.7 'Noto Sans Tamil','Arial Unicode MS',sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--gold)}
a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
nav{position:sticky;top:0;z-index:5;background:rgba(13,18,28,.94);border-bottom:1px solid var(--line);display:flex;gap:4px;align-items:center;overflow-x:auto;padding:0 12px;scrollbar-width:none}
nav b{white-space:nowrap;padding:14px 14px 14px 4px;font-weight:700}
nav a{white-space:nowrap;color:var(--mute);text-decoration:none;padding:14px 10px;font-size:14.5px}
nav a:hover{color:var(--text)}
.hero{position:relative;margin:0}
.hero img{display:block;width:100%;height:auto}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:38%;background:linear-gradient(to bottom,rgba(13,18,28,0),var(--bg))}
main{max-width:980px;margin:0 auto;padding:0 20px 48px}
section{padding-top:44px}
h2{font-size:24px;line-height:1.4;margin:0 0 6px;font-weight:700}
h2::after{content:"";display:block;width:44px;height:3px;background:var(--gold);margin-top:8px}
.sub{color:var(--mute);font-size:14.5px;margin:18px 0 4px;font-weight:600}
.it{display:flex;justify-content:space-between;gap:20px;padding:14px 0;border-bottom:1px solid var(--line)}
.it b{display:block;font-weight:600}
.it span{display:block;color:var(--mute);font-size:14.5px}
.it em{font-style:normal;color:var(--gold);white-space:nowrap;font-size:14.5px;text-align:right}
.book{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:6px;padding:20px 22px;margin-top:18px}
.book h3{margin:0 0 4px;font-size:22px}
.book p{margin:2px 0;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chips span{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 14px;font-size:14.5px}
.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:18px}
.contact div{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;overflow-wrap:anywhere}
.contact small{display:block;color:var(--mute)}
footer{border-top:1px solid var(--line);color:var(--mute);text-align:center;padding:20px;font-size:14px}
@media(max-width:620px){.it{flex-direction:column;gap:2px}.it em{text-align:left}h2{font-size:21px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
